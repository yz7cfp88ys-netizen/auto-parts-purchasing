<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Management | PARTSBRIDGE</title><link rel="icon" href="./assets/favicon.svg"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./management.css"><script type="module" src="./management.js"></script></head>
<body><main class="management">
<header class="management-header"><div><a class="brand" href="/">PARTSBRIDGE<span class="brand-dot">.</span></a><h1>Procurement management</h1><p>Manage your catalogue and respond to purchasing inquiries.</p></div><button id="logout" class="button button-outline" type="button" hidden>Sign out</button></header>
<p id="management-status" role="status" aria-live="polite"></p>
<form id="management-login" class="management-login"><h2>Administrator sign in</h2><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required maxlength="200" autocomplete="current-password"></label><button class="button">Sign in</button></form>
<div id="management-workspace" hidden>
<nav class="management-nav" aria-label="Management sections"><button type="button" data-panel="inquiries" aria-pressed="true">Inquiries</button><button type="button" data-panel="products" aria-pressed="false">Products</button><button type="button" data-panel="categories" aria-pressed="false">Categories</button></nav>
<section id="panel-inquiries"><h2>Customer inquiries</h2><p id="system-status"></p><form id="inquiry-search" class="management-filters"><label>Search<input name="q" type="search" maxlength="150" placeholder="Reference, company or email"></label><label>Status<select name="status"><option value="">All statuses</option><option>new</option><option>reviewing</option><option>quoted</option><option>closed</option><option>spam</option></select></label><button class="button">Search inquiries</button></form><div id="inquiry-list"></div><div id="inquiry-pages" class="management-actions"></div><section id="inquiry-detail" tabindex="-1"></section></section>
<section id="panel-products" hidden><div class="management-title"><h2>Products</h2><button id="new-product" class="button" type="button">Add product</button></div><form id="product-search" class="management-filters"><label>Search<input name="q" type="search" maxlength="150" placeholder="Name, SKU or specification"></label><button class="button">Search products</button></form>
<form id="product-editor" class="management-editor" hidden><h3 id="product-editor-title">Add product</h3><div class="form-row"><label>SKU<input name="sku" required maxlength="80" pattern="[a-zA-Z0-9._/\-]+"></label><label>Product name<input name="name" required maxlength="200"></label></div><div class="form-row"><label>Category<select name="categoryId" required></select></label><label>Vehicle type<select name="vehicleType"><option value="both">Cars & motorcycles</option><option value="auto">Automotive</option><option value="moto">Motorcycle</option></select></label></div><label>Description<textarea name="description" maxlength="5000" rows="3"></textarea></label><label>Specifications / reference numbers<textarea name="specifications" maxlength="3000" rows="3"></textarea></label><label>Product image URL (HTTPS, optional)<input name="imageUrl" type="url" maxlength="2000" placeholder="https://…"></label><label class="check-label"><input name="active" type="checkbox" checked> Published in the customer catalogue</label><div class="management-actions"><button class="button">Save product</button><button id="cancel-product" type="button" class="button button-outline">Cancel</button></div></form>
<div id="product-list"></div><div id="product-pages" class="management-actions"></div></section>
<section id="panel-categories" hidden><h2>Categories</h2><form id="category-create" class="management-filters"><label>Category name<input name="name" required maxlength="120"></label><button class="button">Add category</button></form><div id="category-list"></div></section>
</div></main></body></html>
